<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/mata.png" />
  <!-- preload Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    >
  </noscript>
  
  <!-- SEO Utama -->
  <title>Muxe | Developer</title>
  <meta name="description" content="Website resmi Muxe, Developer. Saya berfokus pada penciptaan pengalaman digital yang menarik dan selalu berupaya memberikan solusi terbaik dalam setiap proyek yang saya kerjakan." />
  <meta name="keywords" content="Muxe, Developer, Portofolio Muxe" />
  <meta name="author" content="Muxe" />

  <!-- Theme / PWA -->
  <meta name="theme-color" content="#030014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://namakamu.com/" />
  <meta property="og:title" content="Muxe | Developer" />
  <meta property="og:description" content="Website resmi dan portofolio Muxe, Developer." />
  <meta property="og:image" content="https://namakamu.com/Meta.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://namakamu.com/" />
  <meta name="twitter:title" content="Muxe | Developer" />
  <meta name="twitter:description" content="Website resmi dan portofolio Muxe." />
  <meta name="twitter:image" content="https://namakamu.com/Meta.png" />

  <!-- Canonical -->
  <link rel="canonical" href="https://namakamu.com/" />
</head>

<body>
  <!-- Root React -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
